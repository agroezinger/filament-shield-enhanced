version: 2
updates:
  # Aktualisiert deine GitHub Actions (und behält die SHA-Hashes bei)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Optional, aber empfohlen: Aktualisiert auch deine PHP-Pakete
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
